<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>語学フラッシュカード（オフライン版）</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
        margin: 0;
        padding: 14px;
        padding-bottom: calc(14px + env(safe-area-inset-bottom));
        padding-top: calc(14px + env(safe-area-inset-top));
        background: #f8fafc;
        color: #1e293b;
        max-width: 560px;
        margin-left: auto;
        margin-right: auto;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px;
        text-align: center;
        color: #475569;
      }
      .note {
        font-size: 11px;
        color: #94a3b8;
        text-align: center;
        margin-bottom: 14px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
      }
      select, button {
        font: inherit;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        background: #fff;
        padding: 9px 12px;
        cursor: pointer;
        min-height: 44px;
      }
      select {
        flex: 1;
        min-width: 0;
      }
      label.chk {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: #475569;
        width: 100%;
      }
      label.chk input {
        width: 20px;
        height: 20px;
      }
      .summary {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 14px;
        justify-content: center;
      }
      .summary .chip {
        font-size: 11px;
        background: #eef2ff;
        color: #3730a3;
        border-radius: 999px;
        padding: 3px 9px;
      }
      .progress {
        font-size: 13px;
        color: #64748b;
        width: 100%;
        text-align: center;
      }
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .card {
        width: 100%;
        min-height: 220px;
        border-radius: 18px;
        background: #fff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 6px 20px rgba(15, 23, 42, 0.06);
        padding: 24px 18px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        text-align: center;
      }
      .tag {
        display: inline-block;
        align-self: center;
        font-size: 12px;
        color: #4f46e5;
        background: #eef2ff;
        border-radius: 999px;
        padding: 3px 10px;
        margin-bottom: 4px;
      }
      .word-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .word {
        font-size: 26px;
        font-weight: 700;
      }
      .speak-btn {
        border: 1px solid #cbd5e1;
        background: #fff;
        border-radius: 999px;
        width: 40px;
        height: 40px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        line-height: 1;
        flex: none;
      }
      .ex-row {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .ex-row .speak-btn {
        width: 30px;
        height: 30px;
        font-size: 14px;
      }
      .reading {
        font-size: 13px;
        color: #64748b;
      }
      .back-section {
        text-align: left;
        margin-top: 4px;
      }
      .back-section h4 {
        margin: 8px 0 2px;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #94a3b8;
      }
      .back-section p {
        margin: 0;
        font-size: 15px;
        line-height: 1.5;
      }
      .source {
        font-size: 12px;
        color: #94a3b8;
        margin-top: 8px;
      }
      .flip-btn {
        width: 100%;
        background: #4f46e5;
        border-color: #4f46e5;
        color: #fff;
        font-weight: 600;
      }
      .actions {
        display: flex;
        gap: 10px;
        width: 100%;
      }
      .actions button {
        flex: 1;
        font-size: 15px;
      }
      .btn-again {
        border-color: #f87171;
        color: #dc2626;
      }
      .btn-good {
        border-color: #34d399;
        background: #10b981;
        color: #fff;
      }
      .empty, .done {
        text-align: center;
        color: #64748b;
        padding: 30px 0;
      }
      .stats {
        font-size: 14px;
        color: #475569;
      }
      .reset-link {
        display: block;
        text-align: center;
        font-size: 11px;
        color: #94a3b8;
        margin-top: 20px;
        text-decoration: underline;
        background: none;
        border: none;
        width: 100%;
      }
    </style>
  </head>

        {"id":"tr-sormak","language":"トルコ語","word":"sormak","partOfSpeech":"動詞","register":"標準・中立","meaning":"尋ねる","example":"Sana bir şey sormak istiyorum.","exampleMeaning":"あなたに一つ尋ねたいことがあります。","source":"『しっかり学ぶトルコ語』巻末語彙集より(基本語・自作例文)","proficiency":"未着手"},

        {"id":"tr-uzun","language":"トルコ語","word":"uzun","partOfSpeech":"形容詞","register":"標準・中立","meaning":"長い","example":"Bugün çok uzun bir gündü.","exampleMeaning":"今日はとても長い一日でした。","source":"『しっかり学ぶトルコ語』巻末語彙集より(基本語・自作例文)","proficiency":"未着手"},

        {"id":"tr-ve","language":"トルコ語","word":"ve","partOfSpeech":"その他","register":"標準・中立","meaning":"そして、〜と","example":"Ben ve sen arkadaşız.","exampleMeaning":"私とあなたは友達です。","source":"『しっかり学ぶトルコ語』巻末語彙集より(基本語・自作例文)","proficiency":"未着手"},
        {"id":"tr-vermek","language":"トルコ語","word":"vermek","partOfSpeech":"動詞","register":"標準・中立","meaning":"与える","example":"Bana suyu ver.","exampleMeaning":"私に水をください。","source":"『しっかり学ぶトルコ語』巻末語彙集より(基本語・自作例文)","proficiency":"未着手"},

        {"id":"tr-yasamak","language":"トルコ語","word":"yaşamak","partOfSpeech":"動詞","register":"標準・中立","meaning":"住む、生きる","example":"İstanbul'da yaşıyorum.","exampleMeaning":"イスタンブールに住んでいます。","source":"『しっかり学ぶトルコ語』巻末語彙集より(基本語・自作例文)","proficiency":"未着手"},
        {"id":"tr-yazmak","language":"トルコ語","word":"yazmak","partOfSpeech":"動詞","register":"標準・中立","meaning":"書く","example":"Bir mektup yazıyorum.","exampleMeaning":"手紙を書いています。","source":"『しっかり学ぶトルコ語』巻末語彙集より(基本語・自作例文)","proficiency":"未着手"},
        {"id":"tr-yemek","language":"トルコ語","word":"yemek","partOfSpeech":"動詞","register":"標準・中立","meaning":"食べる（名詞では「食事、料理」の意味も）","example":"Akşam yemeği yiyorum.","exampleMeaning":"夕食を食べています。","source":"『しっかり学ぶトルコ語』巻末語彙集より(基本語・自作例文)","proficiency":"未着手"},
        {"id":"tr-yeni","language":"トルコ語","word":"yeni","partOfSpeech":"形容詞","register":"標準・中立","meaning":"新しい","example":"Yeni bir telefon aldım.","exampleMeaning":"新しい電話を買いました。","source":"『しっかり学ぶトルコ語』巻末語彙集より(基本語・自作例文)","proficiency":"未着手"},
        {"id":"tr-yer","language":"トルコ語","word":"yer","partOfSpeech":"名詞","register":"標準・中立","meaning":"場所","example":"Bu güzel bir yer.","exampleMeaning":"ここは素敵な場所です。","source":"『しっかり学ぶトルコ語』巻末語彙集より(基本語・自作例文)","proficiency":"未着手"},
        {"id":"tr-yil","language":"トルコ語","word":"yıl","partOfSpeech":"名詞","register":"標準・中立","meaning":"年","example":"Bu yıl İstanbul'a gidiyorum.","exampleMeaning":"今年イスタンブールに行きます。","source":"『しっかり学ぶトルコ語』巻末語彙集より(基本語・自作例文)","proficiency":"未着手"},
        {"id":"tr-yurumek","language":"トルコ語","word":"yürümek","partOfSpeech":"動詞","register":"標準・中立","meaning":"歩く","example":"Her sabah parkta yürüyorum.","exampleMeaning":"毎朝公園を歩いています。","source":"『しっかり学ぶトルコ語』巻末語彙集より(基本語・自作例文)","proficiency":"未着手"},
        {"id":"tr-zaman","language":"トルコ語","word":"zaman","partOfSpeech":"名詞","register":"標準・中立","meaning":"時間","example":"Zamanım yok.","exampleMeaning":"時間がありません。","source":"『しっかり学ぶトルコ語』巻末語彙集より(基本語・自作例文)","proficiency":"未着手"},
      ];

      const PROF_LEVELS = ["未着手", "学習中", "なじんできた", "習得"];
      const LANGS = ["英語", "スペイン語", "フランス語", "トルコ語"];
      const LANG_CODES = { 英語: "en-US", スペイン語: "es-ES", フランス語: "fr-FR", トルコ語: "tr-TR" };
      const STORAGE_KEY = "mc-vocab-offline-progress-v1";
      const canSpeak = "speechSynthesis" in window;
      const REGISTER_STYLES = {
        フォーマル: { bg: "#eef2ff", fg: "#4338ca" },
        "標準・中立": { bg: "#f1f5f9", fg: "#475569" },
        "口語・カジュアル": { bg: "#ecfdf5", fg: "#059669" },
        "スラング・俗語": { bg: "#fff7ed", fg: "#c2410c" },
        "文語・硬い表現": { bg: "#fdf4ff", fg: "#a21caf" },
      };

      function loadProgress() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        } catch (e) {
          return {};
        }
      }
      function saveProgress(p) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
        } catch (e) {
          console.error("could not save progress", e);
        }
      }
      let progress = loadProgress();

      // Merge embedded baseline proficiency with any locally-saved progress.
      const allItems = DATA.map((it) => ({ ...it, proficiency: progress[it.id] || it.proficiency }));

      function speak(text, language) {
        if (!canSpeak || !text) return;
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = LANG_CODES[language] || "";
          window.speechSynthesis.speak(u);
        } catch (e) {
          console.error("speak failed", e);
        }
      }

      const langSelect = document.getElementById("langSelect");
      const includeMastered = document.getElementById("includeMastered");
      const restartBtn = document.getElementById("restartBtn");
      const stage = document.getElementById("stage");
      const progressEl = document.getElementById("progress");
      const summaryEl = document.getElementById("summary");
      const resetProgressBtn = document.getElementById("resetProgressBtn");

      langSelect.innerHTML =
        '<option value="__all">すべての言語</option>' + LANGS.map((l) => `<option value="${l}">${l}</option>`).join("");

      let queue = [];
      let pos = 0;
      let flipped = false;
      let stats = { good: 0, again: 0 };

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function renderSummary() {
        const lang = langSelect.value;
        const pool = allItems.filter((it) => (lang === "__all" ? true : it.language === lang));
        const counts = { 未着手: 0, 学習中: 0, なじんできた: 0, 習得: 0 };
        pool.forEach((it) => counts[it.proficiency]++);
        summaryEl.innerHTML = PROF_LEVELS.map((l) => `<span class="chip">${l}: ${counts[l]}</span>`).join("");
      }

      function buildQueue() {
        const lang = langSelect.value;
        let pool = allItems.filter((it) => (lang === "__all" ? true : it.language === lang));
        if (!includeMastered.checked) pool = pool.filter((it) => it.proficiency !== "習得");
        queue = shuffle(pool);
        pos = 0;
        flipped = false;
        stats = { good: 0, again: 0 };
        renderSummary();
      }

      function renderProgress() {
        progressEl.textContent = queue.length ? `${Math.min(pos + 1, queue.length)} / ${queue.length}枚` : "";
      }

      function speakBtnHtml(id, size) {
        return canSpeak ? `<button class="speak-btn" id="${id}" title="発音を聞く" style="width:${size}px;height:${size}px;">🔊</button>` : "";
      }

      function renderCard() {
        renderProgress();
        if (!queue.length) {
          stage.innerHTML = '<div class="empty">このデッキにはカードがありません。</div>';
          return;
        }
        if (pos >= queue.length) {
          stage.innerHTML =
            '<div class="done"><div style="font-size:19px;font-weight:700;margin-bottom:6px;">セッション終了！ 🎉</div>' +
            `<div class="stats">できた: ${stats.good} 件 / もう少し: ${stats.again} 件</div></div>`;
          return;
        }
        const it = queue[pos];
        const registerTag = (it) => {
          if (!it.register) return "";
          const s = REGISTER_STYLES[it.register] || { bg: "#eef2ff", fg: "#4f46e5" };
          return `<span class="tag" style="background:${s.bg};color:${s.fg};">${escapeHtml(it.register)}</span>`;
        };
        if (!flipped) {
          stage.innerHTML =
            '<div class="card">' +
            '<div class="tag-row" style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">' +
            (it.partOfSpeech ? `<span class="tag">${it.partOfSpeech}</span>` : "") +
            registerTag(it) +
            "</div>" +
            `<div class="word-row"><div class="word">${escapeHtml(it.word || "")}</div>${speakBtnHtml("speakWordBtn", 36)}</div>` +
            (it.reading ? `<div class="reading">${escapeHtml(it.reading)}</div>` : "") +
            "</div>" +
            '<button class="flip-btn" id="flipBtn">意味を見る</button>';
          const sb = document.getElementById("speakWordBtn");
          if (sb) sb.onclick = () => speak(it.word, it.language);
          document.getElementById("flipBtn").onclick = () => {
            flipped = true;
            renderCard();
          };
        } else {
          stage.innerHTML =
            '<div class="card">' +
            '<div class="tag-row" style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">' +
            (it.partOfSpeech ? `<span class="tag">${it.partOfSpeech}</span>` : "") +
            registerTag(it) +
            "</div>" +
            `<div class="word-row"><div class="word" style="font-size:20px;">${escapeHtml(it.word || "")}</div>${speakBtnHtml("speakWordBtn", 32)}</div>` +
            '<div class="back-section"><h4>意味</h4><p>' +
            escapeHtml(it.meaning || "―") +
            "</p></div>" +
            (it.example
              ? '<div class="back-section"><h4>例文</h4><p>' +
                `<span class="ex-row">${escapeHtml(it.example)}${speakBtnHtml("speakExampleBtn", 26)}</span>` +
                (it.exampleMeaning ? "<br><span style='color:#64748b;font-size:13px;'>" + escapeHtml(it.exampleMeaning) + "</span>" : "") +
                "</p></div>"
              : "") +
            (it.source ? `<div class="source">出典: ${escapeHtml(it.source)}</div>` : "") +
            "</div>" +
            '<div class="actions">' +
            '<button class="btn-again" id="againBtn">もう少し</button>' +
            '<button class="btn-good" id="goodBtn">覚えた！</button>' +
            "</div>";
          const sb = document.getElementById("speakWordBtn");
          if (sb) sb.onclick = () => speak(it.word, it.language);
          const esb = document.getElementById("speakExampleBtn");
          if (esb) esb.onclick = () => speak(it.example, it.language);
          document.getElementById("againBtn").onclick = () => grade(it, false);
          document.getElementById("goodBtn").onclick = () => grade(it, true);
        }
      }

      function grade(item, correct) {
        const idx = PROF_LEVELS.indexOf(item.proficiency);
        const nextIdx = correct ? Math.min(PROF_LEVELS.length - 1, idx + 1) : Math.max(0, idx - 1);
        const nextProf = PROF_LEVELS[nextIdx];
        if (correct) stats.good++;
        else stats.again++;
        item.proficiency = nextProf;
        const localIt = allItems.find((r) => r.id === item.id);
        if (localIt) localIt.proficiency = nextProf;
        progress[item.id] = nextProf;
        saveProgress(progress);
        pos++;
        flipped = false;
        renderCard();
        renderSummary();
      }

      function start() {
        buildQueue();
        renderCard();
      }

      langSelect.onchange = start;
      includeMastered.onchange = start;
      restartBtn.onclick = start;
      resetProgressBtn.onclick = () => {
        if (!confirm("この端末に保存した習熟度の記録をすべてリセットします。よろしいですか？")) return;
        progress = {};
        saveProgress(progress);
        allItems.forEach((it) => {
          const base = DATA.find((d) => d.id === it.id);
          if (base) it.proficiency = base.proficiency;
        });
        start();
      };

      start();
    </script>
